<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PlantFoundry — AI Landscape Planner</title>
  <meta name="description" content="PlantFoundry uses Gemini AI to generate curated plant palettes for any landscape style, complete with botanical photography." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ======= TOP NAV ======= -->
  <header class="topbar" role="banner">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-name">PlantFoundry</span>
      </div>
      <div class="vibe-form" role="search" aria-label="Landscape search">
        <div class="vibe-field-group">
          <div class="vibe-field">
            <label class="vibe-field-label" for="location-input">Location</label>
            <input
              id="location-input"
              type="text"
              class="vibe-input"
              placeholder="Pacific Northwest, Austin TX, Mediterranean…"
              autocomplete="off"
              spellcheck="false"
              aria-label="Location or region"
              maxlength="120"
            />
          </div>
          <div class="vibe-divider" aria-hidden="true"></div>
          <div class="vibe-field">
            <label class="vibe-field-label" for="qualities-input">Qualities</label>
            <input
              id="qualities-input"
              type="text"
              class="vibe-input"
              placeholder="drought tolerant, wildlife friendly, low maintenance…"
              autocomplete="off"
              spellcheck="false"
              aria-label="Desired landscape qualities or attributes"
              maxlength="200"
            />
          </div>
        </div>
        <button id="generate-btn" class="generate-btn" aria-label="Generate plant palette">
          <span class="generate-btn-text">Generate</span>
          <span class="generate-btn-icon" aria-hidden="true">↗</span>
        </button>
      </div>
    </div>
    <div class="topbar-right">
      <button id="btn-info" class="icon-btn" hidden aria-label="Design Rationale" title="Design Rationale">
        i
      </button>

      <!-- View toggle -->
      <div class="view-toggle" role="group" aria-label="Display mode">

        <button id="btn-grid-view" class="view-btn active" title="Grid view" aria-pressed="true" aria-label="Grid view">
          <!-- 5-wide grid icon -->
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1"   y="1"   width="2.4" height="6" rx="0.5" fill="currentColor"/>
            <rect x="4.8" y="1"   width="2.4" height="6" rx="0.5" fill="currentColor"/>
            <rect x="8.6" y="1"   width="2.4" height="6" rx="0.5" fill="currentColor"/>
            <rect x="12.4" y="1"  width="2.4" height="6" rx="0.5" fill="currentColor"/>
            <rect x="1"   y="9"   width="2.4" height="6" rx="0.5" fill="currentColor"/>
            <rect x="4.8" y="9"   width="2.4" height="6" rx="0.5" fill="currentColor"/>
            <rect x="8.6" y="9"   width="2.4" height="6" rx="0.5" fill="currentColor"/>
            <rect x="12.4" y="9"  width="2.4" height="6" rx="0.5" fill="currentColor"/>
          </svg>
        </button>

        <button id="btn-table-view" class="view-btn" title="Table view" aria-pressed="false" aria-label="Table view">
          <!-- Table / list icon -->
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1" y="1.5" width="14" height="1.5" rx="0.5" fill="currentColor"/>
            <rect x="1" y="5"   width="14" height="1.5" rx="0.5" fill="currentColor"/>
            <rect x="1" y="8.5" width="14" height="1.5" rx="0.5" fill="currentColor"/>
            <rect x="1" y="12"  width="14" height="1.5" rx="0.5" fill="currentColor"/>
            <!-- vertical divider -->
            <rect x="5.5" y="1.5" width="1" height="12" rx="0.5" fill="currentColor" opacity="0.35"/>
          </svg>
        </button>

      </div>

      <!-- Export PDF button -->
      <button id="export-btn" class="export-btn" aria-label="Export palette as PDF" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="export-btn-text">Export PDF</span>
      </button>

      <div class="status-label" id="status-label" aria-live="polite" aria-atomic="true"></div>
    </div>
  </header>

  <!-- ======= PROGRESS BAR ======= -->
  <div class="progress-bar-wrap" id="progress-bar-wrap" hidden aria-hidden="true">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <!-- ======= MAIN CONTENT ======= -->
  <main class="main-content" id="main-content">

    <!-- VIEW: GRID — Trees on top, Small Plants on bottom -->
    <div class="grid-shell" id="grid-shell" hidden aria-label="Plant palette grid view">

      <div class="row-label" aria-label="Category: Trees">Trees</div>
      <div class="plant-grid" id="row-trees" role="list" aria-label="Trees"></div>

      <div class="row-label" aria-label="Category: Shrubs &amp; Bushes">Shrubs &amp; Bushes</div>
      <div class="plant-grid" id="row-shrubs" role="list" aria-label="Shrubs and bushes"></div>

      <div class="row-label" aria-label="Category: Small Plants &amp; Grasses">Small Plants &amp; Grasses</div>
      <div class="plant-grid" id="row-small" role="list" aria-label="Small plants and grasses"></div>

    </div>

    <!-- VIEW: TABLE -->
    <div class="table-shell" id="table-shell" hidden aria-label="Plant palette table view">
      <table class="plant-table" id="plant-table">
        <thead>
          <tr>
            <th class="col-thumb"  aria-label="Photo"></th>
            <th class="col-name">Name</th>
            <th class="col-latin">Latin Name</th>
            <th class="col-cat">Category</th>
            <th class="col-spec">Water</th>
            <th class="col-spec">Sun</th>
            <th class="col-spec">Zones</th>
            <th class="col-spec">Height</th>
            <th class="col-spec">Growth</th>
            <th class="col-spec">Soil</th>
            <th class="col-spec">Min Temp</th>
            <th class="col-spec">Colors</th>
          </tr>
        </thead>
        <tbody id="plant-table-body">
          <!-- Rows injected by JS -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- ======= MOBILE PAGE DOTS ======= -->
  <nav class="page-dots" id="page-dots" aria-label="Page navigation" hidden>
    <button class="dot active" data-idx="0" aria-label="Input page" type="button"></button>
    <button class="dot"        data-idx="1" aria-label="Grid view"  type="button"></button>
    <button class="dot"        data-idx="2" aria-label="Table view" type="button"></button>
  </nav>

  <!-- ======= TOAST NOTIFICATIONS ======= -->
  <div class="toast-container" id="toast-container" role="alert" aria-live="assertive"></div>

  <!-- Rationale Modal -->
  <dialog id="rationale-modal" class="rationale-modal">
    <div class="modal-content">
      <button id="close-rationale-btn" class="close-btn" aria-label="Close" title="Close">×</button>
      <h2>The Big Idea</h2>
      <p id="rationale-text"></p>
    </div>
  </dialog>

  <!-- Native print handles PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
